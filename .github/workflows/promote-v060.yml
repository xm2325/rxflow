name: Promote RxFlow v0.6.0

on:
  push:
    branches:
      - agent/rxflow-repair
    paths:
      - '.github/workflows/promote-v060.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rxflow
          POSTGRES_PASSWORD: rxflow
          POSTGRES_DB: rxflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rxflow -d rxflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RXFLOW_POSTGRES_TEST_URL: postgresql://rxflow:rxflow@127.0.0.1:5432/rxflow

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare final v0.6.0 metadata
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (pkg.version !== '0.6.0') throw new Error('package_version_not_v060');
          if (lock.version !== '0.6.0') throw new Error('lock_version_not_v060');

          const path = 'docs/evidence-boundaries.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          data.releaseVersion = '0.6.0';
          data.statuses ??= {};
          data.statuses.postgresAdapter = 'executed-in-ci';
          data.statuses.postgres17CiScenario = 'executed-in-ci';
          data.statuses.containerRuntime = 'executed-in-ci';
          data.statuses.supplyChainAudit = 'executed-in-ci';
          data.statuses.cloudRunCloudSqlPubSub = 'reference-only';
          data.statuses.epic = 'not-integrated';
          data.statuses.surescripts = 'not-integrated';
          data.statuses.realPatientData = 'none';
          data.statuses.clinicalDeployment = 'none';
          data.statuses.complianceCertification = 'none';
          data.publicClaims = [
            'Synthetic FHIR workflow exercised in automated tests',
            'Tenant-scoped idempotency and durable outbox exercised in GitHub Actions',
            'PostgreSQL 17 adapter and schema exercised in GitHub Actions',
            'Container image built and non-root runtime exercised in GitHub Actions',
            'High/critical dependency audit gate exercised in GitHub Actions',
            'GCP infrastructure is a reference deployment target only',
            'Epic and Surescripts are not integrated',
            'No real patient data or clinical deployment'
          ];
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          NODE
          mkdir -p docs/archive/v0.5.0
          for file in docs/run-report-v0.5.0.md docs/release-evidence-v0.5.0.json; do
            if [ -f "$file" ]; then mv "$file" docs/archive/v0.5.0/; fi
          done

      - name: Install locked dependencies
        run: npm ci

      - name: Release contract
        run: npm run release:check

      - name: PostgreSQL 17 live contract
        run: npm run test:postgres:live

      - name: Container runtime contract
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull -t rxflow-release:${GITHUB_SHA} .
          docker run --rm rxflow-release:${GITHUB_SHA} node --input-type=module -e "import('./dist/src/version.js').then(m => { if (m.VERSION !== '0.6.0') process.exit(2); })"
          docker run --rm rxflow-release:${GITHUB_SHA} node -e "if (typeof process.getuid === 'function' && process.getuid() === 0) process.exit(1)"

      - name: Supply-chain contract
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > /tmp/npm-audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          const v = report.metadata?.vulnerabilities ?? {};
          const high = Number(v.high ?? 0);
          const critical = Number(v.critical ?? 0);
          console.log(JSON.stringify({ high, critical }));
          if (high > 0 || critical > 0) process.exit(1);
          NODE
          npm sbom --sbom-format=cyclonedx > /tmp/rxflow-sbom.cdx.json

      - name: Repository surface contract
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f package.json
          test -f package-lock.json
          test -f Dockerfile
          test -d src
          test -d test
          test -d integration
          test -d docs
          test -d infra
          test ! -e .repair
          test ! -e .rxflow-import
          test ! -e .rxflow-import-xz
          test ! -e .rxflow-import-safe
          test ! -e .rxflow-import-final
          test ! -e .upload-marker
          if find . -path './.git' -prune -o -name 'part-*.b64' -print | grep -q .; then
            echo 'transport_part_found'
            exit 1
          fi

      - name: Promote final tree to main
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .repair .rxflow-import .rxflow-import-xz .rxflow-import-safe .rxflow-import-final
          rm -f .upload-marker
          rm -f \
            .github/workflows/bootstrap-build.yml \
            .github/workflows/materialize-large-source.yml \
            .github/workflows/modular-core-tests.yml \
            .github/workflows/postgres17-live.yml \
            .github/workflows/container-runtime.yml \
            .github/workflows/supply-chain.yml \
            .github/workflows/refresh-v060-lock.yml \
            .github/workflows/prepare-v060-evidence.yml \
            .github/workflows/cleanup-repair.yml \
            .github/workflows/promote-v060.yml

          mkdir -p docs/ci-evidence
          source_sha="$(git rev-parse HEAD)"
          audit_high="$(node -e "const r=require('/tmp/npm-audit.json'); console.log(Number(r.metadata?.vulnerabilities?.high ?? 0))")"
          audit_critical="$(node -e "const r=require('/tmp/npm-audit.json'); console.log(Number(r.metadata?.vulnerabilities?.critical ?? 0))")"
          cat > docs/ci-evidence/v0.6.0-release.json <<JSON
          {
            "schemaVersion": 1,
            "releaseVersion": "0.6.0",
            "observedIn": "github-actions",
            "sourceCommit": "${source_sha}",
            "node": "22",
            "postgres": "17",
            "checks": [
              "release-contract",
              "postgres17-live",
              "container-build",
              "container-non-root",
              "dependency-audit"
            ],
            "dependencyAudit": {
              "high": ${audit_high},
              "critical": ${audit_critical}
            },
            "result": "passed"
          }
          JSON
          cp /tmp/rxflow-sbom.cdx.json docs/ci-evidence/sbom.cdx.json

          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tree="$(git write-tree)"
          git fetch origin main
          parent="$(git rev-parse origin/main)"
          commit="$(printf '%s\n\n%s\n' 'Restore and upgrade RxFlow v0.6.0' 'Restore the public source tree, replace monolithic test restoration with modular executable contracts, and add observed PostgreSQL/container/supply-chain CI gates.' | git commit-tree "$tree" -p "$parent")"
          git push origin "${commit}:main"
          echo "promoted_commit=${commit}"
