name: restore-public-source

on:
  push:
    branches:
      - agent/rxflow-repair
    paths:
      - .github/workflows/restore-public-zip.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify cleaned public source
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 \
            https://rxflow-xm2325.serveo.net/rxflow-v0.5.0-public.zip \
            -o /tmp/rxflow-public.zip
          echo "5fe9aa408eba721e716e7f4bed6eea40b5c2ddd9e5112ab8ff859fcb0547321c  /tmp/rxflow-public.zip" | sha256sum -c -
          rm -rf /tmp/rxflow-public
          mkdir -p /tmp/rxflow-public
          unzip -q /tmp/rxflow-public.zip -d /tmp/rxflow-public
          PACKAGE_JSON="$(find /tmp/rxflow-public -maxdepth 3 -type f -name package.json -print -quit)"
          test -n "$PACKAGE_JSON"
          SOURCE_DIR="$(dirname "$PACKAGE_JSON")"
          test -d "$SOURCE_DIR/src"
          test -d "$SOURCE_DIR/test"
          test -f "$SOURCE_DIR/README.md"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Replace staging tree with normal source tree
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$SOURCE_DIR"/. .
          rm -rf .rxflow-import .rxflow-import-xz .rxflow-import-safe .rxflow-import-final .upload-marker
          test -f package.json
          test -f README.md
          test -d src
          test -d test
          test -d integration
          test -d docs
          if find . -maxdepth 2 \( -name 'part-*.b64' -o -name '.rxflow-import*' -o -name '.upload-marker' \) | grep -q .; then
            echo 'temporary import material still present' >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify restored project
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run release:check

      - name: Commit verified normal source tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Restore RxFlow v0.5.0 public source [skip ci]"
          git push origin HEAD:agent/rxflow-repair
