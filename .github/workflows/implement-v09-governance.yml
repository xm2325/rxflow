          Path('test/review-governance.test.ts').write_text(r'''import assert from "node:assert/strict";
import { mkdtempSync, rmSync } from "node:fs";
import { tmpdir } from "node:os";
import { join } from "node:path";
import test from "node:test";
import type { PaDraftGenerator } from "../src/ai.js";
import { AppError } from "../src/errors.js";
import { InMemoryCaseStore, SqliteCaseStore, type CaseStore } from "../src/store.js";
import { buildWorkQueue } from "../src/work-queue.js";
import { RxWorkflowService } from "../src/workflow.js";

const lowConfidenceGenerator: PaDraftGenerator = {
  async generate(input) {
    return {
      answer: "Synthetic low-confidence draft requiring reviewer judgement.",
      evidence: [{ source: "fhir", field: "MedicationRequest.note", value: input.clinicalNote }],
      confidence: 0.55,
      requiresHumanReview: true,
      reason: "Synthetic low-confidence scenario."
    };
  }
};

function request(id: string, code: string) {
  return {
    resourceType: "MedicationRequest",
    id,
    subject: { reference: "Patient/synthetic-governance" },
    medicationCodeableConcept: { coding: [{ code }] },
    insurance: [{ display: "SYNTHETIC_PLAN" }],
    note: [{ text: "Prior therapy trial of methotrexate." }]
  };
}

async function createReviewable(service: RxWorkflowService, prefix: string, tenant = "tenant-governance") {
  for (let i = 0; i < 40; i += 1) {
    const created = await service.ingest(request(`${prefix}-${i}`, String(12000 + i)), `${prefix}-key-${String(i).padStart(4, "0")}`, `${prefix}-corr-${i}`, undefined, tenant);
    if (created.case.status === "HUMAN_REVIEW_REQUIRED") return created.case;
  }
  throw new Error("unable_to_create_reviewable_case");
}

async function codeOf(promise: Promise<unknown>): Promise<string> {
  try { await promise; return ""; }
  catch (error) { return error instanceof AppError ? error.code : "unexpected"; }
}

async function exerciseGovernance(store: CaseStore, service: RxWorkflowService, prefix: string) {
  const tenant = "tenant-governance";
  const base = await createReviewable(service, prefix, tenant);
  const t0 = new Date("2026-08-20T08:00:00.000Z");
  const aliceClaim = await service.claimReview(base.id, "reviewer-alice", base.version, tenant, t0);
  assert.equal(aliceClaim.reviewClaim?.reviewer, "reviewer-alice");
  assert.equal((await service.claimReview(base.id, "reviewer-alice", base.version, tenant, t0)).version, aliceClaim.version);
  assert.equal(await codeOf(service.claimReview(base.id, "reviewer-bob", aliceClaim.version, tenant, t0)), "review_already_claimed");

  const editedAnswer = "Synthetic reviewer edit that requires a second approval.";
  const escalated = await service.approve(base.id, "reviewer-alice", aliceClaim.version, editedAnswer, tenant, `${prefix}-decision-0001`, new Date("2026-08-20T08:01:00.000Z"));
  assert.equal(escalated.status, "HUMAN_REVIEW_REQUIRED");
  assert.equal(escalated.reviewEscalation?.requestedBy, "reviewer-alice");
  assert.equal(escalated.reviewClaim, undefined);
  const replay = await service.approve(base.id, "reviewer-alice", aliceClaim.version, editedAnswer, tenant, `${prefix}-decision-0001`, new Date("2026-08-20T08:02:00.000Z"));
  assert.equal(replay.reviewEscalation?.escalationId, escalated.reviewEscalation?.escalationId);
  assert.equal(await codeOf(service.approve(base.id, "reviewer-alice", aliceClaim.version, "different", tenant, `${prefix}-decision-0001`)), "review_idempotency_key_conflict");
  assert.equal(await codeOf(service.claimReview(base.id, "reviewer-alice", escalated.version, tenant, new Date("2026-08-20T08:03:00.000Z"))), "second_reviewer_must_differ");

  const queue = buildWorkQueue(await service.list(tenant));
  const item = queue.find((candidate) => candidate.caseId === base.id);
  assert.equal(item?.action, "SECOND_REVIEW_APPROVAL");
  assert.equal(item?.secondApprovalRequestedBy, "reviewer-alice");

  const bobClaim = await service.claimReview(base.id, "reviewer-bob", escalated.version, tenant, new Date("2026-08-20T08:04:00.000Z"));
  const final = await service.approveSecondReview(base.id, "reviewer-bob", bobClaim.version, tenant, `${prefix}-second-0001`, new Date("2026-08-20T08:05:00.000Z"));
  assert.equal(final.status, "ROUTED");
  assert.equal(final.reviewDecision?.reviewer, "reviewer-alice");
  assert.equal(final.reviewDecision?.secondReviewer, "reviewer-bob");
  assert.equal(final.reviewDecision?.answerHash.length, 64);
  assert.equal(final.reviewEscalation, undefined);
  assert.equal(final.reviewClaim, undefined);
  const secondReplay = await service.approveSecondReview(base.id, "reviewer-bob", bobClaim.version, tenant, `${prefix}-second-0001`, new Date("2026-08-20T08:06:00.000Z"));
  assert.equal(secondReplay.reviewDecision?.decisionId, final.reviewDecision?.decisionId);

  const events = await store.listOutbox(undefined, tenant);
  assert.equal(events.filter((record) => record.event.type === "PaApproved").length, 1);
  assert.equal(events.filter((record) => record.event.type === "PrescriptionRouted").length, 1);
  return final;
}

test("review claim, escalation, receipt and idempotent second approval work in memory", async () => {
  const store = new InMemoryCaseStore();
  const service = new RxWorkflowService(store, lowConfidenceGenerator);
  await exerciseGovernance(store, service, "mem-governance");
});

test("review governance state and receipt survive SQLite reopen", async () => {
  const folder = mkdtempSync(join(tmpdir(), "rxflow-governance-"));
  const file = join(folder, "rxflow.sqlite");
  try {
    const store = new SqliteCaseStore(file);
    const service = new RxWorkflowService(store, lowConfidenceGenerator);
    const final = await exerciseGovernance(store, service, "sqlite-governance");
    store.close();
    const reopened = new SqliteCaseStore(file);
    const durable = await reopened.get(final.id, "tenant-governance");
    assert.equal(durable?.reviewDecision?.decisionId, final.reviewDecision?.decisionId);
    assert.equal(durable?.reviewDecision?.secondReviewer, "reviewer-bob");
    reopened.close();
  } finally {
    rmSync(folder, { recursive: true, force: true });
  }
});
''')

