name: Prepare v0.6.0 evidence boundary

on:
  push:
    branches:
      - agent/rxflow-repair
    paths:
      - '.github/workflows/prepare-v060-evidence.yml'
      - 'docs/ci-evidence/**'
      - 'src/version.ts'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update evidence boundary from observed files
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'docs/evidence-boundaries.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          data.releaseVersion = '0.6.0';
          data.statuses ??= {};
          const has = p => fs.existsSync(p);
          data.statuses.postgresAdapter = has('docs/ci-evidence/postgres17-live.json') ? 'executed-in-ci' : 'implemented-not-live-here';
          data.statuses.postgres17CiScenario = has('docs/ci-evidence/postgres17-live.json') ? 'executed-in-ci' : 'implemented-awaiting-observed-ci-result';
          data.statuses.containerRuntime = has('docs/ci-evidence/container-runtime.json') ? 'executed-in-ci' : 'implemented-awaiting-observed-ci-result';
          data.statuses.supplyChainAudit = has('docs/ci-evidence/dependency-audit.json') ? 'executed-in-ci' : 'implemented-awaiting-observed-ci-result';
          data.statuses.cloudRunCloudSqlPubSub = 'reference-only';
          data.statuses.epic = 'not-integrated';
          data.statuses.surescripts = 'not-integrated';
          data.statuses.realPatientData = 'none';
          data.statuses.clinicalDeployment = 'none';
          data.statuses.complianceCertification = 'none';
          data.publicClaims = [
            'Synthetic FHIR workflow implemented and exercised in automated tests',
            'Tenant-scoped idempotency and durable outbox contracts exercised in GitHub Actions',
            ...(has('docs/ci-evidence/postgres17-live.json') ? ['PostgreSQL 17 adapter and schema exercised in GitHub Actions'] : []),
            ...(has('docs/ci-evidence/container-runtime.json') ? ['Container image built and non-root runtime exercised in GitHub Actions'] : []),
            ...(has('docs/ci-evidence/dependency-audit.json') ? ['High/critical dependency audit gate exercised in GitHub Actions'] : []),
            'GCP infrastructure is a reference deployment target only',
            'Epic and Surescripts are not integrated',
            'No real patient data or clinical deployment'
          ];
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          NODE

          mkdir -p docs/archive/v0.5.0
          for file in docs/run-report-v0.5.0.md docs/release-evidence-v0.5.0.json; do
            if [ -f "$file" ]; then mv "$file" docs/archive/v0.5.0/; fi
          done

          cat > docs/project-evidence.md <<'MD'
          # RxFlow project evidence

          RxFlow is an independent synthetic healthcare software-engineering project. This document separates what has been observed in executable CI from what is implemented but not deployed.

          ## Executed in GitHub Actions

          The current v0.6.0 repair/upgrade branch records successful evidence files under `docs/ci-evidence/` only after the corresponding gate completes. The observed contracts include modular workflow/FHIR/outbox/configuration tests, PostgreSQL 17 live integration, container runtime checks, and dependency/SBOM checks when their evidence files are present.

          ## Implemented boundaries

          The codebase contains tenant-scoped idempotency, optimistic concurrency, transactional outbox persistence, lease-based dispatch, aggregate ordering, dead-letter recovery, two-person destructive recovery approval, bounded operational errors, FHIR ingestion helpers, and PostgreSQL/SQLite storage implementations.

          ## Reference-only infrastructure

          `infra/gcp/` describes a reference Cloud Run / Cloud SQL / Pub/Sub target. Repository infrastructure code or Terraform validation is not evidence that a live GCP environment has been deployed.

          ## Explicit non-claims

          - Epic is not integrated.
          - Surescripts is not integrated.
          - No real patient data is used.
          - No clinical deployment is claimed.
          - No HIPAA, NHS DSPT, SOC 2, or other compliance certification is claimed.

          Synthetic fixtures and CI scenarios are used to exercise engineering contracts without representing a production healthcare deployment.
          MD

      - name: Commit evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/prepare-v060-evidence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs .github/workflows/prepare-v060-evidence.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Prepare v0.6.0 evidence boundary'
          git push origin HEAD:agent/rxflow-repair
