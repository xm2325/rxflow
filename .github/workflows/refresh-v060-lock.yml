name: Refresh v0.6.0 lockfile

on:
  push:
    branches:
      - agent/rxflow-repair
    paths:
      - 'package.json'
      - 'src/version.ts'
      - '.github/workflows/refresh-v060-lock.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh lockfile from exact package versions
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run build
      - run: npm run test:core
      - name: Commit validated lockfile
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/refresh-v060-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json .github/workflows/refresh-v060-lock.yml
          git commit -m 'Refresh v0.6.0 dependency lock'
          git push origin HEAD:agent/rxflow-repair
