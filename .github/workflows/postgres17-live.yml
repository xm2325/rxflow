name: PostgreSQL 17 live contract

on:
  push:
    branches:
      - agent/rxflow-repair
    paths:
      - 'src/**'
      - 'integration/postgres17-live.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/postgres17-live.yml'

permissions:
  contents: write

jobs:
  postgres17-live:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rxflow
          POSTGRES_PASSWORD: rxflow
          POSTGRES_DB: rxflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rxflow -d rxflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RXFLOW_POSTGRES_TEST_URL: postgresql://rxflow:rxflow@127.0.0.1:5432/rxflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node integration/postgres17-live.mjs
      - name: Record observed PostgreSQL CI evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/ci-evidence
          head_sha="$(git rev-parse HEAD)"
          cat > docs/ci-evidence/postgres17-live.json <<JSON
          {
            "schemaVersion": 1,
            "suite": "postgres17-live",
            "observedIn": "github-actions",
            "sourceCommit": "${head_sha}",
            "postgres": "17",
            "schemaVersionObserved": 9,
            "checks": [
              "schema-migration",
              "idempotent-replay",
              "tenant-isolation",
              "concurrent-claim-deduplication"
            ],
            "result": "passed"
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ci-evidence/postgres17-live.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '[skip ci] Record PostgreSQL 17 live evidence'
          git push origin HEAD:agent/rxflow-repair
