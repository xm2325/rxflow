name: Review console CI

on:
  push:
    branches:
      - main
      - agent/v0.7-review-console
    paths:
      - 'web/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/review-console.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/review-console.yml'

permissions:
  contents: read

jobs:
  review-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: review-console-playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
