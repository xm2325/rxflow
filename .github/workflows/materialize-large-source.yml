name: Materialize restored RxFlow source

on:
  push:
    branches:
      - agent/rxflow-repair
    paths:
      - '.repair/**'
      - '.github/workflows/materialize-large-source.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reconstruct large source modules
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src

          cat .repair/src-events/*.part > src/events.ts
          cat .repair/src-outbox-ops/*.part > src/outbox-ops.ts
          cat .repair/src-store/*.part > src/store.ts
          cat .repair/src-postgres-store/*.part > src/postgres-store.ts

          fetch_blob() {
            local sha="$1"
            local output="$2"
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/git/blobs/${sha}" \
              | python3 -c 'import base64,json,sys; d=json.load(sys.stdin); sys.stdout.buffer.write(base64.b64decode(d["content"]))' \
              > "$output"
          }

          fetch_blob 7fcc0319775bfd732c45a8aed227f3efb560c0f3 src/server.ts
          fetch_blob c986b923b0d004668b9d10e4684ec8097dc3bf7d src/workflow.ts

          verify_blob() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(git hash-object "$path")"
            echo "$path  $actual"
            test "$actual" = "$expected"
          }

          verify_blob src/events.ts f197cd169cb96c5556752fdf4a202efdab5f5f61
          verify_blob src/outbox-ops.ts bdcdb1f1ca5b1b8601186f97cd99099895ea1609
          verify_blob src/store.ts 58e32b7147a2dfba94bcfdec2d8e2c5a6dd3f24c
          verify_blob src/postgres-store.ts cfee3bcd1e749984626f4082192a43ad6a7db402
          verify_blob src/server.ts 7fcc0319775bfd732c45a8aed227f3efb560c0f3
          verify_blob src/workflow.ts c986b923b0d004668b9d10e4684ec8097dc3bf7d

      - name: Remove transport material
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .repair
          rm -f .github/workflows/materialize-large-source.yml

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m '[skip ci] Materialize restored RxFlow core source'
          git push origin HEAD:agent/rxflow-repair
