name: Supply-chain contract

on:
  push:
    branches:
      - agent/rxflow-repair
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/supply-chain.yml'

permissions:
  contents: write

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit high and critical vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > /tmp/npm-audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          const vulnerabilities = report.metadata?.vulnerabilities ?? {};
          const high = Number(vulnerabilities.high ?? 0);
          const critical = Number(vulnerabilities.critical ?? 0);
          console.log(JSON.stringify({ high, critical, vulnerabilities }));
          if (high > 0 || critical > 0) process.exit(1);
          NODE
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx > /tmp/rxflow-sbom.cdx.json
      - name: Record observed supply-chain evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/ci-evidence
          head_sha="$(git rev-parse HEAD)"
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          const v = report.metadata?.vulnerabilities ?? {};
          fs.writeFileSync('docs/ci-evidence/dependency-audit.json', JSON.stringify({
            schemaVersion: 1,
            suite: 'dependency-audit',
            observedIn: 'github-actions',
            sourceCommit: process.env.GITHUB_SHA,
            high: Number(v.high ?? 0),
            critical: Number(v.critical ?? 0),
            result: 'passed'
          }, null, 2) + '\n');
          NODE
          cp /tmp/rxflow-sbom.cdx.json docs/ci-evidence/sbom.cdx.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ci-evidence/dependency-audit.json docs/ci-evidence/sbom.cdx.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '[skip ci] Record supply-chain evidence'
          git push origin HEAD:agent/rxflow-repair
