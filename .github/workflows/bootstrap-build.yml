name: Bootstrap restored source

on:
  push:
    branches:
      - agent/rxflow-repair
    paths:
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/bootstrap-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Recreate deterministic lockfile if needed
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts
          fi
      - run: npm ci
      - run: npm run build
      - name: Commit recovered lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m '[skip ci] Restore npm lockfile'
          git push origin HEAD:agent/rxflow-repair
